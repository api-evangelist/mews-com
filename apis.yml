apis:
- aid: mews-com:mews-channel-manager-api
  name: Mews Channel Manager API
  tags:
  - Hospitality
  - Hotel
  - Channel Manager
  - Distribution
  - Inventory
  humanURL: https://docs.mews.com/channel-manager-api
  properties:
  - url: https://docs.mews.com/channel-manager-api
    type: Documentation
  - url: https://docs.mews.com/channel-manager-api/usage-guidelines
    name: Usage Guidelines
    type: Documentation
  - url: https://docs.mews.com/channel-manager-api/concepts
    name: Concepts
    type: Documentation
  - url: https://docs.mews.com/channel-manager-api/changelog
    name: Changelog
    type: ChangeLog
  description: >-
    Two-way API for channel managers and distribution channels. Mews-side operations let channel managers
    receive reservations from Mews; channel-manager-side endpoints let Mews push availability, rate, and
    inventory updates outbound. Mediates OTA, GDS, and metasearch traffic into the Mews reservation graph.
- aid: mews-com:mews-pos-api
  name: Mews POS API
  tags:
  - Hospitality
  - Hotel
  - POS
  - Point of Sale
  - Food and Beverage
  humanURL: https://docs.mews.com/pos-api
  properties:
  - url: https://docs.mews.com/pos-api
    type: Documentation
  description: >-
    API for Point-of-Sale systems to integrate with Mews — provides real-time visibility into F&B operations
    including outlets, items, orders, and invoices, and pushes charges onto guest bills inside the Mews
    PMS. Used by partner POS vendors and Mews POS itself.
- aid: mews-com:mews-loyalty-partner-api
  name: Mews Loyalty Partner API
  tags:
  - Hospitality
  - Hotel
  - Loyalty
  - Members
  - Rewards
  humanURL: https://docs.mews.com/loyalty-partner-api
  properties:
  - url: https://docs.mews.com/loyalty-partner-api
    type: Documentation
  description: >-
    Reverse API for loyalty program providers — Mews calls the partner's endpoints to look up members,
    validate enrollment, fetch tier and benefit data, and record earn/redeem activity during the guest
    journey. Complements the Connector API Loyalty operation group on the Mews side.
