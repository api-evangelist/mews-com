              Client: Sample Client 1.0.0
              ResourceAccessTokenUpdates:
              - ResourceAccessTokenId: 35d4b117-4e60-44a3-9580-c582117eff98
                ValidityStartUtc:
                  Value: '2020-10-09T22:00:00Z'
                ValidityEndUtc:
                  Value: '2020-10-10T22:00:00Z'
