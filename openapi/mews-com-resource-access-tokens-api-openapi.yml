components:
  schemas:
    StringUpdateValue:
      title: String update value
      type: object
      properties:
        Value:
          type: string
          description: Value which is to be updated.
          nullable: true
      additionalProperties: false
      x-schema-id: StringUpdateValue
    ResourceAccessTokenPermissions:
      title: Resource access token permissions
      type: object
      properties:
        Bed:
          type: boolean
          description: Specify whether the resource access token grants permission to access bed.
        Room:
          type: boolean
          description: Specify whether the resource access token grants permission to access room.
        Floor:
          type: boolean
          description: Specify whether the resource access token grants permission to access floor.
        Building:
          type: boolean
          description: Specify whether the resource access token grants permission to access building.
      additionalProperties: false
      description: ''
      x-schema-id: ResourceAccessTokenPermissions
    ResourceAccessTokenUpdateResult:
      title: ResourceAccessTokenUpdateResult
      required:
      - ResourceAccessTokens
      type: object
      properties:
        ResourceAccessTokens:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAccessToken'
          description: Updated resource access tokens.
      additionalProperties: false
      x-schema-id: ResourceAccessTokenUpdateResult
    ResourceAccessTokenDeleteParameters:
      title: ResourceAccessTokenDeleteParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - Ids
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        Ids:
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the resource access token to delete.
      additionalProperties: false
      x-schema-id: ResourceAccessTokenDeleteParameters
    ResourceAccessTokenFilterParameters:
      title: ResourceAccessTokenFilterParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - Limitation
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        Limitation:
          allOf:
          - $ref: '#/components/schemas/Limitation'
          description: Limitation on the quantity of data returned and optional Cursor for the starting point of data.
        EnterpriseIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the Enterprises. If not specified, the operation returns data for all enterprises within scope of the Access Token.
          nullable: true
        ResourceAccessTokenIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of resource access token. Required if no other filter is provided.
          nullable: true
        ServiceOrderIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of reservations. Required if no other filter is provided.
          nullable: true
        CollidingUtc:
          title: Time interval
          allOf:
          - $ref: '#/components/schemas/TimeFilterInterval'
          description: Interval in which the resource access token is valid. Required if no other filter is provided.
          nullable: true
          x-max-interval-in-months: 3
        UpdatedUtc:
          title: Time interval
          allOf:
          - $ref: '#/components/schemas/TimeFilterInterval'
          description: Interval in which resource access token was updated. Required if no other filter is provided.
          nullable: true
          x-max-interval-in-months: 3
        ActivityStates:
          type: array
          items:
            type: string
          description: Whether to return only active, only deleted or both records.
          nullable: true
      additionalProperties: false
      x-schema-id: ResourceAccessTokenFilterParameters
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type: string
          nullable: true
        RequestId:
          type: string
          nullable: true
        Details:
          nullable: true
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    ResourceAccessTokenPermissionsParameters:
      title: Resource access token permission parameter
      type: object
      properties:
        Bed:
          title: Boolean update value
          allOf:
          - $ref: '#/components/schemas/BooleanUpdateValue'
          description: Specify whether the resource access token grants permission to access bed (or null if not being updated).
          nullable: true
        Room:
          title: Boolean update value
          allOf:
          - $ref: '#/components/schemas/BooleanUpdateValue'
          description: Specify whether the resource access token grants permission to access room (or null if not being updated).
          nullable: true
        Floor:
          title: Boolean update value
          allOf:
          - $ref: '#/components/schemas/BooleanUpdateValue'
          description: Specify whether the resource access token grants permission to access floor (or null if not being updated).
          nullable: true
        Building:
          title: Boolean update value
          allOf:
          - $ref: '#/components/schemas/BooleanUpdateValue'
          description: Specify whether the resource access token grants permission to access building (or null if not being updated).
          nullable: true
      additionalProperties: false
      x-schema-id: ResourceAccessTokenPermissionsParameters
    Unit:
      type: object
      additionalProperties: false
    Limitation:
      title: Limitation
      required:
      - Count
      type: object
      properties:
        Count:
          type: integer
          format: int32
        Cursor:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
      description: Limitation on the quantity of data returned.
      x-schema-id: Limitation
    BooleanUpdateValue:
      title: Boolean update value
      type: object
      properties:
        Value:
          type: boolean
          description: Value which is to be updated.
      additionalProperties: false
      x-schema-id: BooleanUpdateValue
    MultipleResourceAccessTokenUpdateParameters:
      title: MultipleResourceAccessTokenUpdateParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        EnterpriseId:
          type: string
          description: Unique identifier of the enterprise. Required when using [Portfolio Access Tokens](https://mews-systems.gitbook.io/connector-api/concepts/multi-property), ignored otherwise.
          format: uuid
          nullable: true
        ResourceAccessTokenUpdates:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAccessTokenUpdateParameters'
          description: Parameters of resource access token to update.
          nullable: true
      additionalProperties: false
      x-schema-id: MultipleResourceAccessTokenUpdateParameters
    ResourceAccessTokenType:
      title: Resource access token type
      enum:
      - PinCode
      - RfidTag
      type: string
      description: Type of stored value.
    TimeFilterInterval:
      title: Time interval
      type: object
      properties:
        StartUtc:
          type: string
          format: date-time
          nullable: true
        EndUtc:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      description: "When a time interval is used for **filtering** (for example in parameters such as `CreatedUtc.StartUtc` / `CreatedUtc.EndUtc`), the following rules apply:\r\n\r\n- **Start equals End (equality mode)**  \r\n  If `StartUtc` and `EndUtc` are exactly the same timestamp, the filter is treated as an equality check for that precise moment in time:\r\n  \r\n  ```\r\n  CreatedUtc == StartUtc\r\n  ```\r\n  \r\n  This does not represent an interval; only records with `CreatedUtc` equal to that exact instant are returned.\r\n\r\n- **Start differs from End (interval mode)**  \r\n  If `StartUtc` and `EndUtc` are different, the filter is evaluated as a half-open interval:\r\n  \r\n  ```\r\n  StartUtc <= CreatedUtc < EndUtc\r\n  ```\r\n  \r\n  In other words, the start is inclusive and the end is exclusive.\r\n\r\nMake sure your integration takes inclusive Start / exclusive End behavior of time intervals into account so that no records at the boundaries are omitted."
      x-schema-id: TimeFilterInterval
    ResourceAccessTokenUpdateParameters:
      title: Resource access token update
      required:
