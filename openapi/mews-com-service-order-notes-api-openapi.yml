components:
  schemas:
    StringUpdateValue:
      title: String update value
      type: object
      properties:
        Value:
          type: string
          description: Value which is to be updated.
          nullable: true
      additionalProperties: false
      x-schema-id: StringUpdateValue
    ServiceOrderNoteUpdateResult:
      title: ServiceOrderNoteUpdateResult
      required:
      - ServiceOrderNotes
      type: object
      properties:
        ServiceOrderNotes:
          type: array
          items:
            $ref: '#/components/schemas/OrderNote'
          description: Updated service order notes.
      additionalProperties: false
      x-schema-id: ServiceOrderNoteUpdateResult
    ServiceOrderNoteAdditionResult:
      title: ServiceOrderNoteAdditionResult
      required:
      - ServiceOrderNotes
      type: object
      properties:
        ServiceOrderNotes:
          type: array
          items:
            $ref: '#/components/schemas/OrderNote'
          description: Added service order notes.
      additionalProperties: false
      x-schema-id: ServiceOrderNoteAdditionResult
    Unit:
      type: object
      additionalProperties: false
    ServiceOrderNoteDeleteParameters:
      title: ServiceOrderNoteDeleteParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - ServiceOrderNoteIds
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        ServiceOrderNoteIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the service order notes to be deleted.
      additionalProperties: false
      x-schema-id: ServiceOrderNoteDeleteParameters
    ServiceOrderNoteUpdateParameters:
      title: Service order note update parameters
      required:
      - ServiceOrderNoteId
      type: object
      properties:
        ServiceOrderNoteId:
          type: string
          description: Unique identifier of the `Service order note`.
          format: uuid
        Text:
          title: String update value
          allOf:
          - $ref: '#/components/schemas/StringUpdateValue'
          description: Content of the service order note (or `null` if the content should not be updated).
          nullable: true
      additionalProperties: false
      x-schema-id: ServiceOrderNoteUpdateParameters
    OrderNote:
      title: Service order note
      type: object
      properties:
        Id:
          type: string
          description: Unique identifier of the service order note.
          format: uuid
        OrderId:
          type: string
          description: Unique identifier of the `Service order` to which the Service Order Note belongs.
          format: uuid
        Text:
          type: string
          description: Content of the service order note.
          nullable: true
        Type:
          title: Service order note type
          allOf:
          - $ref: '#/components/schemas/OrderNoteTypeEnum'
          description: 'A discriminator specifying the type of service order note, e.g. general or channel manager.


            General


            ChannelManager


            SpecialRequest'
          x-enumNames:
          - General
          - ChannelManager
          - SpecialRequest
          x-enumDescriptions:
          - ''
          - ''
          - ''
        CreatedUtc:
          type: string
          description: Creation date and time of the service order note in UTC timezone in ISO 8601 format.
          format: date-time
          nullable: true
        UpdatedUtc:
          type: string
          description: Last update date and time of the service order note in UTC timezone in ISO 8601 format.
          format: date-time
          nullable: true
      additionalProperties: false
      x-schema-id: OrderNote
    ServiceOrderNoteFilterParameters:
      title: ServiceOrderNoteFilterParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - Limitation
      - ServiceOrderIds
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        Limitation:
          allOf:
          - $ref: '#/components/schemas/Limitation'
          description: Limitation on the quantity of data returned and optional Cursor for the starting point of data.
        EnterpriseIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the Enterprises. If not specified, the operation returns data for all enterprises within scope of the Access Token.
          nullable: true
        ServiceOrderIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of `Service order`. Reservation IDs or Order IDs can be used as service order identifiers.
        ServiceOrderNoteIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of `Service order note`. Use this property if you want to fetch specific service order notes.
          nullable: true
        UpdatedUtc:
          title: Time interval
          allOf:
          - $ref: '#/components/schemas/TimeFilterInterval'
          description: Timestamp in UTC timezone ISO 8601 format when the service order note was updated.
          nullable: true
          x-max-interval-in-months: 3
        Types:
          type: array
          items:
            $ref: '#/components/schemas/OrderNoteTypeEnum'
          description: Type of the service order note. Defaults to `["General", "ChannelManager"]`.
          nullable: true
      additionalProperties: false
      x-schema-id: ServiceOrderNoteFilterParameters
    ServiceOrderNoteResult:
      title: ServiceOrderNoteResult
      required:
      - ServiceOrderNotes
      type: object
      properties:
        ServiceOrderNotes:
          type: array
          items:
            $ref: '#/components/schemas/OrderNote'
          description: The collection of service order notes.
        Cursor:
          type: string
          description: Unique identifier of the last and hence oldest service order note returned. This can be used in [Limitation](https://mews-systems.gitbook.io/connector-api/guidelines/pagination/#limitation) in a subsequent request to fetch the next batch of older service order notes.
          format: uuid
          nullable: true
      additionalProperties: false
      x-schema-id: ServiceOrderNoteResult
    TimeFilterInterval:
      title: Time interval
      type: object
      properties:
        StartUtc:
          type: string
          format: date-time
          nullable: true
        EndUtc:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      description: "When a time interval is used for **filtering** (for example in parameters such as `CreatedUtc.StartUtc` / `CreatedUtc.EndUtc`), the following rules apply:\r\n\r\n- **Start equals End (equality mode)**  \r\n  If `StartUtc` and `EndUtc` are exactly the same timestamp, the filter is treated as an equality check for that precise moment in time:\r\n  \r\n  ```\r\n  CreatedUtc == StartUtc\r\n  ```\r\n  \r\n  This does not represent an interval; only records with `CreatedUtc` equal to that exact instant are returned.\r\n\r\n- **Start differs from End (interval mode)**  \r\n  If `StartUtc` and `EndUtc` are different, the filter is evaluated as a half-open interval:\r\n  \r\n  ```\r\n  StartUtc <= CreatedUtc < EndUtc\r\n  ```\r\n  \r\n  In other words, the start is inclusive and the end is exclusive.\r\n\r\nMake sure your integration takes inclusive Start / exclusive End behavior of time intervals into account so that no records at the boundaries are omitted."
      x-schema-id: TimeFilterInterval
    MultipleServiceOrderNoteAddParameters:
      title: MultipleServiceOrderNoteAddParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - ServiceOrderNotes
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        ServiceOrderNotes:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderNoteAddParameters'
          description: Notes to be added.
      additionalProperties: false
      x-schema-id: MultipleServiceOrderNoteAddParameters
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type: string
          nullable: true
        RequestId:
          type: string
          nullable: true
        Details:
          nullable: true
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    ServiceOrderNoteAddParameters:
      title: Service order note parameters
      required:
      - ServiceOrderId
      - Text
      type: object
      properties:
        ServiceOrderId:
          type: string
          description: Unique identifier of the `Service order` to which note will be added.
          format: uuid
        Text:
          minLength: 1
          type: string
          description: Content of the service order note.
      additionalProperties: false
      x-schema-id: ServiceOrderNoteAddParameters
    OrderNoteTypeEnum:
      title: Service order note type
      enum:
      - General
      - ChannelManager
      - SpecialRequest
      type: string
      description: '


        General


        ChannelManager


        SpecialRequest'
      x-enumNames:
      - General
      - ChannelManager
      - SpecialRequest
      x-enumDescriptions:
      - ''
      - ''
      - ''
    MultipleServiceOrderNoteUpdateParameters:
      title: MultipleServiceOrderNoteUpdateParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - ServiceOrderNoteUpdates
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        ServiceOrderNoteUpdates:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderNoteUpdateParameters'
          description: Notes to be updated.
      additionalProperties: false
      x-schema-id: MultipleServiceOrderNoteUpdateParameters
    Limitation:
      title: Limitation
      required:
      - Count
      type: object
      properties:
        Count:
          type: integer
          format: int32
        Cursor:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
      description: Limitation on the quantity of data returned.
      x-schema-id: Limitation
