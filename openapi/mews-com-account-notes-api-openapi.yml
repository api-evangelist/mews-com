components:
  schemas:
    StringUpdateValue:
      title: String update value
      type: object
      properties:
        Value:
          type: string
          description: Value which is to be updated.
          nullable: true
      additionalProperties: false
      x-schema-id: StringUpdateValue
    AccountNote:
      title: Account note
      required:
      - AccountId
      - AccountType
      - Classifications
      - Content
      - CreatorProfile
      - Id
      - IsActive
      - UpdaterProfile
      type: object
      properties:
        Id:
          type: string
          description: Unique identifier of the account note.
          format: uuid
        AccountId:
          type: string
          description: Unique identifier of the account.
          format: uuid
        Content:
          minLength: 1
          type: string
          description: The content of the account note.
        AccountType:
          title: Account type
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          description: 'Specifying type of associated account.


            Company


            Customer'
          x-enumNames:
          - Company
          - Customer
          x-enumDescriptions:
          - ''
          - ''
        Classifications:
          type: array
          items:
            $ref: '#/components/schemas/AccountNoteClassificationEnum'
          description: Specifying the classifications of the note based on account type.
        IsActive:
          type: boolean
          description: Whether the account note is still active.
        CreatorProfile:
          title: Profile data
          allOf:
          - $ref: '#/components/schemas/ProfileData'
          description: The profile data of the user who created the account note.
        UpdaterProfile:
          title: Profile data
          allOf:
          - $ref: '#/components/schemas/ProfileData'
          description: The profile data of the user who updated the account note.
      additionalProperties: false
      x-schema-id: AccountNote
    AccountNoteUpdateParameters:
      title: Account note update parameters
      required:
      - AccountNoteId
      - Classifications
      type: object
      properties:
        AccountNoteId:
          type: string
          description: Unique identifier of the account note.
          format: uuid
        Content:
          title: String update value
          maxLength: 1000
          minLength: 1
          allOf:
          - $ref: '#/components/schemas/StringUpdateValue'
          description: Content of the account note (or `null` if the content should not be updated).
          nullable: true
        Classifications:
          title: Account note update classifications
          allOf:
          - $ref: '#/components/schemas/AccountNoteUpdateClassifications'
          description: Classification of the account note.
      additionalProperties: false
      x-schema-id: AccountNoteUpdateParameters
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type: string
          nullable: true
        RequestId:
          type: string
          nullable: true
        Details:
          nullable: true
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    AccountNoteAdditionResult:
      title: AccountNoteAdditionResult
      required:
      - AccountNotes
      type: object
      properties:
        AccountNotes:
          type: array
          items:
            $ref: '#/components/schemas/AccountNote'
          description: Added account notes.
      additionalProperties: false
      x-schema-id: AccountNoteAdditionResult
    Unit:
      type: object
      additionalProperties: false
    EnterpriseProfileData:
      title: Enterprise profile data
      required:
      - ProfileId
      type: object
      properties:
        ProfileId:
          type: string
          description: Unique identifier of the profile.
          format: uuid
      additionalProperties: false
      x-schema-id: EnterpriseProfileData
    AccountNoteAddParameters:
      title: Account note parameters
      required:
      - AccountId
      - Classifications
      - Content
      type: object
      properties:
        AccountId:
          type: string
          format: uuid
        Content:
          maxLength: 1000
          minLength: 1
          type: string
          description: The content of the account note.
        Classifications:
          maxItems: 1
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AccountNoteClassificationEnum'
          description: Specifying the classifications of the note based on account type.
      additionalProperties: false
      x-schema-id: AccountNoteAddParameters
    MultipleAccountNoteAddParameters:
      title: MultipleAccountNoteAddParameters
      required:
      - AccessToken
      - AccountNotes
      - Client
      - ClientToken
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        ChainId:
          type: string
          description: Unique identifier of the chain. Required when using [Portfolio Access Tokens](https://mews-systems.gitbook.io/connector-api/concepts/multi-property), ignored otherwise.
          format: uuid
          nullable: true
        AccountNotes:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/AccountNoteAddParameters'
          description: Account notes to be added.
      additionalProperties: false
      x-schema-id: MultipleAccountNoteAddParameters
    AccountNoteClassificationEnum:
      title: Account note classification
      enum:
      - General
      - FoodAndBeverage
      - FrontOffice
      - Reservations
      - Housekeeping
      - Maintenance
      - PreviousStay
      - FamilyRelations
      - Gifts
      - Accounting
      - Complaints
      - Other
      type: string
      description: '


        General (For Company and Customer)


        FoodAndBeverage (Only Customer)


        FrontOffice (Only Customer)


        Reservations (Only Customer)


        Housekeeping (Only Customer)


        Maintenance (Only Customer)


        PreviousStay (Only Customer)


        FamilyRelations (Only Customer)


        Gifts (Only Customer)


        Accounting (Only Customer)


        Complaints (Only Customer)


        Other (Only Customer)'
      x-enumNames:
      - General
      - FoodAndBeverage
      - FrontOffice
      - Reservations
      - Housekeeping
      - Maintenance
      - PreviousStay
      - FamilyRelations
      - Gifts
      - Accounting
      - Complaints
      - Other
      x-enumDescriptions:
      - For Company and Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      - Only Customer
      x-extensible: true
    Limitation:
      title: Limitation
      required:
      - Count
      type: object
      properties:
        Count:
          type: integer
          format: int32
        Cursor:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
      description: Limitation on the quantity of data returned.
      x-schema-id: Limitation
    BooleanUpdateValue:
      title: Boolean update value
      type: object
      properties:
        Value:
          type: boolean
          description: Value which is to be updated.
      additionalProperties: false
      x-schema-id: BooleanUpdateValue
    AccountNoteFilterParameters:
      title: AccountNoteFilterParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - Limitation
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        Limitation:
          allOf:
          - $ref: '#/components/schemas/Limitation'
          description: Limitation on the quantity of data returned and optional Cursor for the starting point of data.
        ChainIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of `Chain`. If not specified, the operation returns data for all chains within scope of the Access Token.
          nullable: true
        AccountNoteIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of [Account note](https://mews-systems.gitbook.io/connector-api/operations/#account-note).
          nullable: true
        AccountIds:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the accounts ([Customer](https://mews-systems.gitbook.io/connector-api/operations/customers/#customer) or [Company](https://mews-systems.gitbook.io/connector-api/operations/companies/#company)).
          nullable: true
        UpdatedUtc:
          title: Time interval
          allOf:
          - $ref: '#/components/schemas/TimeFilterInterval'
          description: Interval of Account note's last update date and time.
          nullable: true
          x-max-interval-in-months: 3
        ActivityStates:
          type: array
          items:
            $ref: '#/components/schemas/ActivityStates'
          description: Whether to return only active, only deleted or both records.
          nullable: true
      additionalProperties: false
      x-schema-id: AccountNoteFilterParameters
    AccountTypeEnum:
      title: Account type
      enum:
      - Company
      - Customer
      type: string
      description: 'A discriminator specifying the account type, e.g. `Customer` or `Company`


        Company


        Customer'
      x-enumNames:
      - Company
      - Customer
      x-enumDescriptions:
      - ''
      - ''
    ActivityStates:
      title: Activity state
      enum:
      - Deleted
      - Active
      type: string
      description: Activity states used for filtering.
    AccountNoteUpdateClassifications:
      title: Account note update classifications
      type: object
      properties:
        General:
          title: Boolean update value
