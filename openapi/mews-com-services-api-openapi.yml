                - '2024-02-02T23:00:00Z'
                - '2024-02-03T23:00:00Z'
                - '2024-02-04T23:00:00Z'
                ResourceCategoryAvailabilities:
                - ResourceCategoryId: d1801d11-fe8d-404b-a26f-af170189605a
