              - PublicAvailabilityAdjustment
              - OtherServiceReservationCount
              - Occupied
              - ConfirmedReservations
              - OptionalReservations
              - BlockAvailability
              - AllocatedBlockAvailability
              - UsableResources
              - ActiveResources
              - HouseUse
      responses:
        '200':
          description: OK
          content:
            application/json:
