      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationsChannelManagerDetailsFilterParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
