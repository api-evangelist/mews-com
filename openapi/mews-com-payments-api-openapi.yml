  /api/connector/v1/payments/addCreditCard:
    post:
      tags:
      - Payments
      summary: Add credit card payment
      description: 'Adds a new credit card payment to a bill of the specified customer. Note that the payment is added to open bill of the customer, either to the specified one or the default one. This operation only serves to record a credit card payment that has already been taken outside of Mews or Mews'' payment terminal, and does not actually charge the customer''s credit card.

        The bill can then be closed manually by a Mews user, or automatically via API with the Close bill operation.'
      operationId: payments_addCreditCard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardPaymentParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              CustomerId: 35d4b117-4e60-44a3-9580-c582117eff98
              Amount:
                Currency: GBP
                GrossValue: 100
              CreditCard:
                Type: Visa
                Number: 411111******1111
                Expiration: 12/2016
                Name: John Smith
              AccountingCategoryId: null
              ReceiptIdentifier: '123456'
              Notes: Terminal A
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCreditCardResult'
              example:
                CreditCardId: ee2209ce-71c6-4e3a-978f-aac700c82c7b
