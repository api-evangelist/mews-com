components:
  schemas:
    RateGroup:
      title: RateGroup
      required:
      - Id
      - Ordering
      - SettlementAction
      - SettlementCurrencyCode
      - SettlementOffset
      - SettlementTrigger
      - SettlementType
      type: object
      properties:
        Id:
          type: string
          format: uuid
        Ordering:
          type: integer
          format: int32
        SettlementType:
          $ref: '#/components/schemas/SettlementRuleType'
        SettlementAction:
          $ref: '#/components/schemas/SettlementRuleAction'
        SettlementTrigger:
          $ref: '#/components/schemas/SettlementRuleTrigger'
        SettlementOffset:
          minLength: 1
          type: string
        SettlementValue:
          type:
          - number
          - 'null'
          format: double
        SettlementFlatValue:
          type:
          - number
          - 'null'
          format: double
        SettlementMaximumNights:
          type:
          - integer
          - 'null'
          format: int32
          deprecated: true
        SettlementMaximumTimeUnits:
          type:
          - integer
          - 'null'
          format: int32
        SettlementCurrencyCode:
          maxLength: 3
          minLength: 1
          type: string
          format: currency
      additionalProperties: false
      x-schema-id: RateGroup
    SurchargeConfiguration:
      title: SurchargeConfiguration
      required:
      - SurchargeFees
      type: object
      properties:
        SurchargeServiceId:
          type:
          - string
          - 'null'
          format: uuid
        SurchargeFees:
          type: object
          additionalProperties:
            type: number
            format: double
      additionalProperties: false
      x-schema-id: SurchargeConfiguration
    Payment:
      title: Payment
      required:
      - Amount
      - CreatedUtc
      - EnterpriseId
      - Id
      - State
      type: object
      properties:
        Id:
          type: string
          format: uuid
        EnterpriseId:
          type: string
          format: uuid
        PaymentRequestId:
          type:
          - string
          - 'null'
          format: uuid
        CreatedUtc:
          minLength: 1
          type: string
          format: date-time
        State:
          $ref: '#/components/schemas/PaymentState'
        Amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        ChargeAmount:
          allOf:
          - $ref: '#/components/schemas/Amount'
      additionalProperties: false
      x-schema-id: Payment
    AgeCategoryClassification:
      enum:
      - Adult
      - Child
      type: string
    ReservationSettlement:
      title: ReservationSettlement
      required:
      - Action
      - Amount
      - IsTriggeredOnConfirmation
      - Trigger
      - TriggerOffset
      - Type
      type: object
      properties:
        Amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
        Action:
          $ref: '#/components/schemas/SettlementRuleAction'
        Type:
          $ref: '#/components/schemas/SettlementRuleType'
        Trigger:
          $ref: '#/components/schemas/SettlementRuleTrigger'
        TriggerOffset:
          minLength: 1
          type: string
        IsTriggeredOnConfirmation:
          type: boolean
      additionalProperties: false
      x-schema-id: ReservationSettlement
    AmountPart:
      enum:
      - NetValue
      - TaxValue
      - GrossValue
      type: string
    CreditCardData:
      title: CreditCardData
      required:
      - Expiration
      type: object
      properties:
        PaymentGatewayData:
          minLength: 11
          type:
          - string
          - 'null'
        ObfuscatedCreditCardNumber:
          type:
          - string
          - 'null'
        Expiration:
          minLength: 1
          type: string
          format: date
        HolderName:
          type:
          - string
          - 'null'
      additionalProperties: false
      x-schema-id: CreditCardData
    ProductPrice:
      title: ProductPrice
      required:
      - AgeCategoryPrices
      - ProductId
      - TotalAmount
      - UnitAmount
      type: object
      properties:
        ProductId:
          type: string
          format: uuid
        TotalAmount: {}
        UnitAmount: {}
        AgeCategoryPrices:
          type: array
          items:
            $ref: '#/components/schemas/AgeCategoryProductPrice'
      additionalProperties: false
      x-schema-id: ProductPrice
    ProductOrderPricingInfo:
      title: ProductOrderPricingInfo
      required:
      - ChargingMode
      - ProductId
      - ProductName
      - ProductOptions
      - TotalAmount
      type: object
      properties:
        ProductId:
          type: string
          format: uuid
        AgeCategoryId:
          type:
          - string
          - 'null'
          format: uuid
        ProductName:
          type: object
          additionalProperties:
            type: string
        ProductOptions:
          allOf:
          - $ref: '#/components/schemas/ProductOptions'
        ChargingMode:
          $ref: '#/components/schemas/ProductChargingMode'
