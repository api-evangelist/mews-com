  /api/connector/v1/customers/add:
    post:
      tags:
      - Customers
      summary: Add customer
      description: Adds a new customer to the system and returns details of the added customer. If a customer with the specified email already exists, and `OverwriteExisting` is set to `true`, then the existing customer profile information is overwritten and the existing customer data returned. If `OverwriteExisting` is set to `false`, an error response is returned. Note this operation supports Portfolio Access Tokens.
      operationId: customers_add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              Title: Miss
              FirstName: Thea
              LastName: Carbone
              BirthDate: '1985-09-30'
              BirthPlace: Pescara (BI)
              Occupation: Giornalista
              Email: thea@quotidiano.example
              Phone: +39 06 555 5555
              Notes: Check-in notturno.
              CarRegistrationNumber: AA 111AA
              TaxIdentificationNumber: ZGNZLR17U72P554F
