        Surcharge


        TaxCorrection


        ResourceUpgradeFee


        InvoiceFee


        MulticurrencyFee


        AllowanceDiscount


        AllowanceBreakage


        AllowanceContraBreakage'
      x-enumNames:
      - CancellationFee
      - NightRebate
      - ProductOrderRebate
      - AdditionalExpenseRebate
      - Deposit
      - ExchangeRateDifference
      - CustomItem
      - ServiceCharge
      - CityTax
      - CityTaxDiscount
      - SpaceOrder
      - ProductOrder
      - Surcharge
      - TaxCorrection
      - ResourceUpgradeFee
      - InvoiceFee
      - MulticurrencyFee
      - AllowanceDiscount
      - AllowanceBreakage
      - AllowanceContraBreakage
