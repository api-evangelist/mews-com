components:
  schemas:
    StringUpdateValue:
      title: String update value
      type: object
      properties:
        Value:
          type: string
          description: Value which is to be updated.
          nullable: true
      additionalProperties: false
      x-schema-id: StringUpdateValue
    Resource:
      title: Resource
      required:
      - CreatedUtc
      - Data
      - Descriptions
      - Directions
      - EnterpriseId
      - ExternalNames
      - Id
      - IsActive
      - Name
      - State
      - UpdatedUtc
      type: object
      properties:
        Id:
          type: string
          description: Unique identifier of the resource.
          format: uuid
        EnterpriseId:
          type: string
          description: Unique identifier of the `Enterprise`.
          format: uuid
        IsActive:
          type: boolean
          description: Whether the resource is still active.
        ParentResourceId:
          type: string
          description: Identifier of the parent `Resource` (e.g. room of a bed).
          format: uuid
          nullable: true
        Name:
          minLength: 1
          type: string
          description: Name of the resource (e.g. room number).
        State:
          $ref: '#/components/schemas/ResourceState'
        Descriptions:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of the description.
          x-schema-id: LocalizedStrings
        CreatedUtc:
          minLength: 1
          type: string
          description: Creation date and time of the resource in UTC timezone in ISO 8601 format.
        UpdatedUtc:
          minLength: 1
          type: string
          description: Last update date and time of the resource in UTC timezone in ISO 8601 format.
        Data:
          title: Resource data
          type: object
          properties:
            Discriminator:
              $ref: '#/components/schemas/ResourceDataDiscriminator'
            Value:
              oneOf:
              - $ref: '#/components/schemas/SpaceData'
              - title: Object resource data
                type: object
                additionalProperties: false
              - title: Person resource data
                type: object
                additionalProperties: false
              description: Based on `Discriminator`. Currently present only for `Space` resources with [Space resource data](https://mews-systems.gitbook.io/connector-api/operations/resources#space-resource-data).
          description: Additional data of the resource.
          x-coproduct: true
          x-schema-id: ResourceDataCoproductOfResourceDataDiscriminator
        ExternalNames:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of external name.
          x-schema-id: LocalizedStrings
        Directions:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of direction.
          x-schema-id: LocalizedStrings
      additionalProperties: false
      x-schema-id: Resource
    SpaceData:
      title: Space resource data
      required:
      - FloorNumber
      type: object
      properties:
        FloorNumber:
          minLength: 1
          type: string
          description: Number of the floor the space is on.
        LocationNotes:
          type: string
          description: Location notes for the space. It can be, for example, Building number the space is located in or the Parking area the particular parking space is at.
          nullable: true
      additionalProperties: false
      x-schema-id: SpaceData
    ResourceClassification:
      title: Resource classification
      enum:
      - StandardSingle
      - StandardDouble
      - SuperiorTwin
      - SuperiorDouble
      - JuniorSuite
      - SharedOrDorm
      - Other
      - SuperiorSingle
      - Triple
      - Family
      - StandardTwin
      - Studio
      - SuperiorTripleRoom
      - OneBedroomApartment
      - ThreeBedroomsApartment
      - TwoBedroomsApartment
      type: string
      description: Classification of the resource category.
    ResourceResult:
      title: ResourceResult
      type: object
      properties:
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: The resources of the enterprise.
          nullable: true
        ResourceCategories:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCategory'
          description: Categories of resources in the enterprise.
          nullable: true
          deprecated: true
        ResourceCategoryAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCategoryAssignment'
          description: Assignments of resources to categories.
          nullable: true
          deprecated: true
        ResourceCategoryImageAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCategoryImageAssignment'
          description: Assignments of images to categories.
          nullable: true
          deprecated: true
        ResourceFeatures:
          type: array
          items:
            $ref: '#/components/schemas/ResourceFeature'
          description: Features of resources in the enterprise.
          nullable: true
          deprecated: true
        ResourceFeatureAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ResourceFeatureAssignment'
          description: Assignments of resource features to resources.
          nullable: true
          deprecated: true
        Cursor:
          type: string
          description: Unique identifier of the item one newer in time order than the items to be returned. If Cursor is not specified, i.e. `null`, then the latest or most recent items will be returned.
          format: uuid
          nullable: true
      additionalProperties: false
      x-schema-id: ResourceResult
    ResourceFeature:
      title: Resource feature
      required:
      - Classification
      - CreatedUtc
      - Descriptions
      - Id
      - IsActive
      - Names
      - ServiceId
      - ShortNames
      - UpdatedUtc
      type: object
      properties:
        Id:
          type: string
          description: Unique identifier of `ResourceFeature`.
          format: uuid
        ServiceId:
          type: string
          description: Unique identifier of `Service` the resource feature belongs to.
          format: uuid
        IsActive:
          type: boolean
          description: Whether the `ResourceFeature` is active.
        Classification:
          $ref: '#/components/schemas/ResourceFeatureClassification'
        Names:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of the name.
          x-schema-id: LocalizedStrings
        ShortNames:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of the short name.
          x-schema-id: LocalizedStrings
        Descriptions:
          title: Localized text
          type: object
          additionalProperties:
            type: string
          description: All translations of the description.
          x-schema-id: LocalizedStrings
        CreatedUtc:
          minLength: 1
          type: string
          description: Creation date and time of the resource feature in UTC timezone in ISO 8601 format.
          format: date-time
        UpdatedUtc:
          minLength: 1
          type: string
          description: Last update date and time of the resource feature in UTC timezone in ISO 8601 format.
          format: date-time
      additionalProperties: false
      x-schema-id: ResourceFeature
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type: string
          nullable: true
        RequestId:
          type: string
          nullable: true
        Details:
          nullable: true
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    ResourcesOccupancyStateFilterParameters:
      title: ResourcesOccupancyStateFilterParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - ResourceCategoryIds
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
        ResourceCategoryIds:
          maxItems: 5
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the `ResourceCategory`.
        ResourceStates:
          type: array
          items:
            $ref: '#/components/schemas/ResourceState'
          description: States of the `Resource`
          nullable: true
        OccupancyStates:
          type: array
          items:
            $ref: '#/components/schemas/OccupancyStateEnum'
          description: Occupancy states of the `Resource`.
          nullable: true
      additionalProperties: false
      x-schema-id: ResourcesOccupancyStateFilterParameters
    ResourceUpdateParameters:
      title: Resource update
      required:
      - ResourceId
      type: object
      properties:
        ResourceId:
          type: string
          description: Unique identifier of the `Resource` which is updated.
          format: uuid
        Name:
          title: String update value
          allOf:
          - $ref: '#/components/schemas/StringUpdateValue'
          description: New name of the resource (e.g. room number).
          nullable: true
        ParentResourceId:
          title: Guid update value
          allOf:
          - $ref: '#/components/schemas/GuidNullableUpdateValue'
          description: Identifier of the new parent `Resource`.
          nullable: true
        Data:
          title: Resource data update
          type: object
          properties:
            Discriminator:
              $ref: '#/components/schemas/ResourceDataDiscriminator'
            Value:
              oneOf:
              - $ref: '#/components/schemas/SpaceDataUpdateParameters'
              - title: Object resource data update
                type: object
                additionalProperties: false
              - title: Person resource data update
                type: object
                additionalProperties: false
              description: Based on `Discriminator`. Currently supported only for `Space` resources with [Space resource data update](https://mews-systems.gitbook.io/connector-api/operations/resources#space-resource-data-update).
          description: New additional data of the resource.
          nullable: true
          x-coproduct: true
          x-schema-id: ResourceUpdateParametersDataCoproductOfResourceDataDiscriminator
        State:
          title: String update value
          allOf:
          - $ref: '#/components/schemas/StringUpdateValue'
          description: New `ResourceState` except `OutOfOrder`.
          nullable: true
        StateReason:
          title: String update value
          allOf:
          - $ref: '#/components/schemas/StringUpdateValue'
          description: New reason for the state of the resource.
          nullable: true
      additionalProperties: false
      x-schema-id: ResourceUpdateParameters
    ResourceCategoryType:
      title: Resource category type
      enum:
      - Room
      - Bed
      - Dorm
      - Apartment
      - Suite
      - Villa
      - Site
      - Office
      - MeetingRoom
      - ParkingSpot
      - Desk
      - TeamArea
      - Membership
      - Tent
      - CaravanOrRV
      - UnequippedCampsite
      - Bike
      - ExtraBed
      - Cot
      - Crib
      - ConferenceRoom
      - Rooftop
      - Garden
      - Restaurant
      - Amphitheater
      - PrivateSpaces
      type: string
      description: Type of the category.
    ResourceState:
      title: Resource state
      enum:
      - Dirty
      - Clean
      - Inspected
      - OutOfService
      - OutOfOrder
      type: string
      description: 'State of the resource.


        Dirty


        Clean


        Inspected


        OutOfService


        OutOfOrder'
      x-enumNames:
      - Dirty
      - Clean
      - Inspected
      - OutOfService
      - OutOfOrder
      x-enumDescriptions:
      - ''
      - ''
      - ''
      - ''
      - ''
      x-schema-id: ResourceState
    Unit:
      type: object
      additionalProperties: false
    ResourceOccupancyState:
      title: Resource occupancy state
      required:
      - OccupancyState
      - ResourceId
      - ResourceState
      type: object
      properties:
        ResourceId:
          type: string
          description: Unique identifier of the resource.
          format: uuid
        ResourceState:
          title: Resource state
