  /api/connector/v1/bills/close:
    post:
      tags:
      - Bills
      summary: Close bill
      description: Closes a bill so no further modification to it is possible. Note this operation supports Portfolio Access Tokens.
      operationId: bills_close
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillCloseParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
