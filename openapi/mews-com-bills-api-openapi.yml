              BillId: 44eba542-193e-47c7-8077-abd7008eb206
              EnterpriseId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              Type: Receipt
              BillCounterId: 84b25778-c1dd-48dc-8c00-ab3a00b6df14
              FiscalMachineId: null
              Options:
                DisplayCustomer:
                  Value: false
                DisplayTaxation: null
              TaxedDate:
                Value: '2020-07-07'
              DueDate:
                Value: '2020-07-14'
              VariableSymbol:
                Value: '5343'
              AccountTaxIdentifier:
                Value: '446768'
              AccountAddress:
                Line1: Astronautů 2
                Line2: ''
                City: Havířov
                PostalCode: 736 01
                CountryCode: CZ
                CountrySubdivisionCode: null
              PurchaseOrderNumber:
                Value: XX-123
