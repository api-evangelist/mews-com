openapi: 3.2.0
info:
  title: Connector Bills API
  description: General-purpose API that enables partners of Mews to access data and services in Mews Operations
  termsOfService: https://www.mews.com/en/terms-conditions/partners
  contact:
    name: Partner success
    email: partnersuccess@mews.com
  version: v1
servers:
- url: https://api.mews.com
tags:
- name: Bills
paths:
  /api/connector/v1/bills/update:
    post:
      tags:
      - Bills
      summary: Update bills
      description: Updates one or more existing bills in the system. Closed bills cannot be updated. Note this operation supports Portfolio Access Tokens.
      operationId: bills_update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipleBillsUpdateParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              BillsUpdates:
              - BillId: ea087d64-3901-4eee-b0b7-9fce4c58a005
                AccountId:
                  Value: c6f5c82d-621a-4c8a-903b-1b0a9a23b71f
                AssociatedAccountIds:
                  Value:
                  - fadd5bb6-b428-45d5-94f8-fd0d89fece6d
              EnterpriseId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillsUpdateResult'
              example:
                Bills:
                - Id: ea087d64-3901-4eee-b0b7-9fce4c58a005
                  Name: Accommodation Charges
                  EnterpriseId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  AccountId: c6f5c82d-621a-4c8a-903b-1b0a9a23b71f
                  AccountType: Company
                  CustomerId: null
                  CompanyId: null
                  AssociatedAccountIds:
                  - fadd5bb6-b428-45d5-94f8-fd0d89fece6d
                  CounterId: null
                  State: Closed
                  Type: Invoice
                  Number: '29'
                  VariableSymbol: null
                  CreatedUtc: '2017-01-31T10:48:06Z'
                  IssuedUtc: '2017-01-31T10:58:06Z'
                  TaxedUtc: null
                  PaidUtc: null
                  DueUtc: null
                  LastReminderDateUtc: null
                  UpdatedUtc: '2017-01-31T10:58:06Z'
                  PurchaseOrderNumber: XX-123
                  Notes: ''
                  Options:
                    DisplayCustomer: true
                    DisplayTaxation: true
                    TrackReceivable: true
                    DisplayCid: false
                    Rebated: false
                  Revenue: []
                  Payments: []
                  OrderItems: []
                  PaymentItems: []
                  AssigneeData: null
                  OwnerData:
                    Discriminator: BillCompanyData
                    Value:
                      Id: 26afba60-06c3-455b-92db-0e3983be0b1d
                      Address:
                        Line1: I.P. Pavlova 5
                        Line2: null
                        City: Prague
                        PostalCode: '12000'
                        SubdivisionCode: CZ-PR
                        CountryCode: CZ
                      LegalIdentifiers:
                        TaxIdentifier: CZ24227781
                        CityOfRegistration: Prague
                      BillingCode: Billing code value
                      Name: Acme, Inc.
                      FiscalIdentifier: Fiscal identifier
                      AdditionalTaxIdentifier: Additional tax identifier
                      DUNS: '150483782'
                      Telephone: '+420123456789'
                      TaxIdentifier: CZ24227781
                      InvoicingEmail: billing@acme.example
                      Department: Billing
                  CompanyDetails: null
                  AssociatedAccountData:
                  - Discriminator: BillCompanyData
                    BillCustomerData: null
                    BillCompanyData:
                      Id: 26afba60-06c3-455b-92db-0e3983be0b1d
                      Address:
                        Line1: I.P. Pavlova 5
                        Line2: null
                        City: Prague
                        PostalCode: '12000'
                        SubdivisionCode: CZ-PR
                        CountryCode: CZ
                      LegalIdentifiers:
                        TaxIdentifier: CZ24227781
                        CityOfRegistration: Prague
                      BillingCode: Billing code value
                      Name: Acme, Inc.
                      FiscalIdentifier: Fiscal identifier
                      AdditionalTaxIdentifier: Additional tax identifier
                      DUNS: '150483782'
                      Telephone: '+420123456789'
                      TaxIdentifier: CZ24227781
